name: Cross-platform tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cuda: default
          - os: windows-latest
            cuda: default
          - os: windows-latest
            cuda: cuda13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      - run: uv python install 3.10.18
      - if: matrix.cuda == 'default'
        run: uv sync --locked --all-groups
      - if: matrix.cuda == 'cuda13'
        run: uv sync --locked --no-group cuda126 --extra cuda13
      - run: uv run --no-sync python -c "from comictranslate.validation import ensure_supported_runtime; ensure_supported_runtime()"
      - run: uv run --no-sync pytest
      - run: uv run --no-sync comictranslate --help
