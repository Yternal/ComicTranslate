[project]
name = "comictranslate"
version = "0.1.0"
description = "Local end-to-end comic image translation for macOS and Windows"
readme = "README.md"
requires-python = "==3.10.18"
dependencies = [
    "loguru==0.7.3",
    "mlx-vlm==0.6.15; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy==2.2.6",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.15.1",
]

[project.optional-dependencies]
cuda13 = ["torch==2.13.0; sys_platform == 'win32'", "torchvision==0.28.0; sys_platform == 'win32'"]

[tool.uv]
default-groups = ["dev", "cuda126"]
conflicts = [[{group = "cuda126"}, {extra = "cuda13"}]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'", extra = "cuda13" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'", group = "cuda126" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'", extra = "cuda13" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'", group = "cuda126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
comictranslate = "comictranslate.cli:main"

[dependency-groups]
cuda126 = ["torch==2.13.0; sys_platform == 'win32'", "torchvision==0.28.0; sys_platform == 'win32'"]
dev = [
    "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires local model files and performs real inference",
]
